[sdl]
fullscreen=false
output=overlay

[mixer]
nosound=false
rate=49716
blocksize=2048
prebuffer=20

[render]
aspect=true

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
oplmode=opl3
oplemu=nuked
oplrate=49716

[dosbox]
machine=svga_s3
captures=capture
memsize=16

[cpu]
core=auto
cputype=auto
cycles=fixed 20000

[autoexec]
mount c c:\silixcon-devel\opl\doom
c:
@echo .
@echo ============================================================
@echo  DOOM - OPL capture session
@echo ------------------------------------------------------------
@echo  If first run, run SETUP.EXE and pick:
@echo    Music = Sound Blaster Pro / 16, Port 220, IRQ 7, DMA 1
@echo    Sound = same
@echo  Then start DOOM with:  doom -nomonsters -nosound  (just music)
@echo  Or just:  doom
@echo .
@echo  Capture controls:
@echo    Ctrl+Alt+F7  : start / stop OPL capture (.dro to capture\)
@echo    Ctrl+F10     : release / grab the mouse
@echo    Type EXIT    : quit DOSBox
@echo ============================================================
@echo .
